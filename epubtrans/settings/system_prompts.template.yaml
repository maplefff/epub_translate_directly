# {name} 的書本設定（extract / build 用）。譯例與譯名表寫在 drafts/translation_notes.md。
book:
  title: "{name}"
  title_zh: ""                 # 譯本書名；可含原文附註，如「心之地圖（Atlas of the Heart）」，檔名會砍掉附註
  author: ""
  source_lang: "English"
  target_lang: "zh-TW"
  source_file: "{src}"         # 原檔（.epub／.pdf／.acsm）；留空＝自動找目錄裡唯一的一個
  identifier: "epubtrans-{name}-zh-TW"   # 建好就別改：閱讀器靠它認書（閱讀進度、劃線），書本目錄改名也照舊
  description: ""
  translator: ""               # 翻譯模型的名稱，例 "Claude Opus 5.5"；colophon 與 PDF 書名頁聲明的 {translator} 由此代入
  title_overrides: {}          # 同名章節標題按章節 id 指定譯名，例：{c008: "第一章"}
  # 譯本版權頁（EPUB 與 PDF 都有），一行一段：原書全名、原書版權、版權歸屬、聲明、正式中譯本（查得到才寫）
  colophon: |
    {原書全名}
    Copyright © {年份} by {作者}
    本書英文原著版權歸屬 {作者} 及 {原出版社} 所有。
    本譯本由 {translator} 輔助翻譯產生，僅供個人閱讀研究使用，非商業發行，不代表任何正式授權譯本。
    本書在台灣另有{出版社}出版的正式授權中譯本《{中譯書名}》（{譯者}譯，{年份}），與本譯本無關。

extract:
  heading_levels: {}           # 例：{h2: 1, h2b: 2}  這個 class 的標題當第幾層章節（會切章）
  para_headings: []             # 例：[H1]  這個 class 的 <p> 當章內小標（不切章）
  skip_files: []                # spine 檔名含這些字串就跳過（例：原書自帶的 CONTENTS 頁）
  # chapter_levels: {}         # 按章節 id 覆寫層級，例：{c008: 2}
  # title_items: {}            # 章名在正文開頭幾段 <p> 時，按章節 id 指定前幾段併成章名，例：{c008: 2}

# PDF 排版（python -m epubtrans pdf）的書本設定；版型數字由紙張自動算出，這裡只寫本書專屬的。
# 書名頁：中文書名、英文原書名（較小字級的副標）、「{作者} 著」；
# 頁底的「本譯本由 {translator} 輔助翻譯產生……」是 print_profile.yaml 的預設 imprint，不必寫。
print:
  title: ""                    # 中文書名
  subtitle: ""                 # 英文原書名，例 "House of Debt"
  author: ""                   # 中文作者名＋全形空格＋著，例 "阿蒂夫・米安、阿米爾・蘇斐　著"
